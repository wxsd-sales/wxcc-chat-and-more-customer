<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>United Airlines Support</title>
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif;
        background-color: #f5f5f5;
        color: #000;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      #app {
        width: 100%;
        max-width: 480px;
        min-height: 100dvh;
        background-color: #fff;
        display: flex;
        flex-direction: column;
      }

      /* ── Top header bar ── */
      #header {
        background-color: #1a56a0;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
      }

      #header-logo {
        height: 32px;
        width: auto;
        object-fit: contain;
      }

      #header-title {
        color: #fff;
        font-size: 1rem;
        font-weight: 400;
        letter-spacing: 0.01em;
        flex: 1;
      }

      #header-camera {
        flex-shrink: 0;
        opacity: 0.9;
      }

      /* ── Hero image ── */
      #hero-image {
        width: 100%;
        aspect-ratio: 16 / 7;
        object-fit: cover;
        display: block;
        border-radius: 0 0 16px 16px;
      }

      /* ── Content area ── */
      #content {
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: 20px 16px 16px;
        gap: 16px;
      }

      #greeting {
        font-size: 1rem;
        font-weight: 600;
        color: #333;
      }

      #subtext {
        font-size: 0.85rem;
        color: #666;
        margin-top: 4px;
      }

      /* ── Chat wrapper ── */
      #chat-wrapper {
        flex: 1;
        display: flex;
        flex-direction: column;
        border: 1px solid #e6e8e8;
        border-radius: 12px;
        overflow: hidden;
        min-height: 0;
      }

      #chat-history {
        flex: 1;
        overflow-y: auto;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        background-color: #fafafa;
        min-height: 200px;
        max-height: 420px;
      }

      .chat-message {
        max-width: 78%;
        padding: 8px 14px;
        border-radius: 18px;
        font-size: 0.85rem;
        line-height: 1.4;
        word-break: break-word;
      }

      .chat-message--me {
        align-self: flex-end;
        background-color: #888;
        color: #fff;
        border-bottom-right-radius: 4px;
      }

      .chat-message--them {
        align-self: flex-start;
        background-color: #e6e8e8;
        color: #000;
        border-bottom-left-radius: 4px;
      }

      /* ── Chat input bar ── */
      #chat-input-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        background-color: #fff;
        border-top: 1px solid #e6e8e8;
      }

      #chat-input {
        flex: 1;
        border: 1px solid #ccc;
        border-radius: 20px;
        padding: 8px 16px;
        font-size: 0.85rem;
        font-family: inherit;
        color: #000;
        background-color: #fff;
        outline: none;
        transition: border-color 150ms ease;
      }

      #chat-input::placeholder {
        color: #aaa;
      }

      #chat-input:focus {
        border-color: #888;
      }

      #chat-send {
        flex-shrink: 0;
        background-color: #888;
        color: #fff;
        border: none;
        border-radius: 20px;
        padding: 8px 18px;
        font-size: 0.85rem;
        font-family: inherit;
        font-weight: 500;
        cursor: pointer;
        transition: background-color 150ms ease;
      }

      #chat-send:active {
        background-color: #666;
      }

      /* ── Status message ── */
      #status {
        font-size: 0.75rem;
        color: #aaa;
        text-align: center;
        padding-bottom: 4px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header id="header">
        <img
          id="header-logo"
          src="https://www.united.com/2500e4e62233fbfe8ac6.unitedLogoNew.svg"
          alt="United Airlines"
        />
        <span id="header-title">Agent on Demand</span>
        <svg id="header-camera" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white" width="22" height="22" style="cursor:pointer; opacity:0.4;" aria-label="Toggle video">
          <path d="M17 10.5V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3.5l4 4v-11l-4 4z"/>
        </svg>
        <svg id="header-mic" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white" width="22" height="22" style="cursor:pointer; opacity:0.4;" aria-label="Toggle audio">
          <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15c-.08-.49-.49-.85-.98-.85-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.1-.6-.39-1.14-1-1.14z"/>
        </svg>
      </header>

      <div id="video-container" style="display:none; position:relative; background:#000;">
        <video id="remote-view-video" autoplay playsinline style="width:100%; display:block;"></video>
        <audio id="remote-view-audio" autoplay playsinline></audio>
        <video id="self-view" muted autoplay playsinline style="position:absolute; top:8px; right:8px; width:25%; border-radius:8px;"></video>
      </div>

      <img
        id="hero-image"
        src="https://images.unsplash.com/photo-1436491865332-7a61a109cc05?w=800&q=80"
        alt="United Airlines"
      />

      <div id="content">
        <div>
          <p id="greeting">Hi, how can we help?</p>
          <p id="subtext">A United Airlines agent is ready to assist you.</p>
        </div>

        <div id="chat-wrapper">
          <div id="chat-history"></div>
          <div id="chat-input-bar">
            <input
              id="chat-input"
              type="text"
              placeholder="Type a message..."
              autocomplete="off"
              autocorrect="off"
            />
            <button id="chat-send">Send</button>
          </div>
        </div>

        <p id="status"></p>
      </div>
    </div>

    <script crossorigin src="https://unpkg.com/webex@3.7.0/umd/webex.min.js"></script>
    <script src="./index.js"></script>
  </body>
</html>
