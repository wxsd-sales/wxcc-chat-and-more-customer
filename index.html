<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>United Airlines Support</title>
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif;
        background-color: #f5f5f5;
        color: #000;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      #app {
        width: 100%;
        max-width: 480px;
        min-height: 100dvh;
        background-color: #fff;
        display: flex;
        flex-direction: column;
      }

      /* ── Top header bar ── */
      #header {
        background-color: #003087;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
      }

      #header-logo {
        height: 32px;
        width: auto;
        object-fit: contain;
      }

      #header-title {
        color: #fff;
        font-size: 1rem;
        font-weight: 400;
        letter-spacing: 0.01em;
      }

      /* ── Hero image ── */
      #hero-image {
        width: 100%;
        aspect-ratio: 16 / 7;
        object-fit: cover;
        display: block;
        border-radius: 0 0 16px 16px;
      }

      /* ── Content area ── */
      #content {
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: 20px 16px 16px;
        gap: 16px;
      }

      #greeting {
        font-size: 1rem;
        font-weight: 600;
        color: #333;
      }

      #subtext {
        font-size: 0.85rem;
        color: #666;
        margin-top: 4px;
      }

      /* ── Chat wrapper ── */
      #chat-wrapper {
        flex: 1;
        display: flex;
        flex-direction: column;
        border: 1px solid #e6e8e8;
        border-radius: 12px;
        overflow: hidden;
        min-height: 0;
      }

      #chat-history {
        flex: 1;
        overflow-y: auto;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        background-color: #fafafa;
        min-height: 200px;
        max-height: 420px;
      }

      .chat-message {
        max-width: 78%;
        padding: 8px 14px;
        border-radius: 18px;
        font-size: 0.85rem;
        line-height: 1.4;
        word-break: break-word;
      }

      .chat-message--me {
        align-self: flex-end;
        background-color: #888;
        color: #fff;
        border-bottom-right-radius: 4px;
      }

      .chat-message--them {
        align-self: flex-start;
        background-color: #e6e8e8;
        color: #000;
        border-bottom-left-radius: 4px;
      }

      /* ── Chat input bar ── */
      #chat-input-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        background-color: #fff;
        border-top: 1px solid #e6e8e8;
      }

      #chat-input {
        flex: 1;
        border: 1px solid #ccc;
        border-radius: 20px;
        padding: 8px 16px;
        font-size: 0.85rem;
        font-family: inherit;
        color: #000;
        background-color: #fff;
        outline: none;
        transition: border-color 150ms ease;
      }

      #chat-input::placeholder {
        color: #aaa;
      }

      #chat-input:focus {
        border-color: #888;
      }

      #chat-send {
        flex-shrink: 0;
        background-color: #888;
        color: #fff;
        border: none;
        border-radius: 20px;
        padding: 8px 18px;
        font-size: 0.85rem;
        font-family: inherit;
        font-weight: 500;
        cursor: pointer;
        transition: background-color 150ms ease;
      }

      #chat-send:active {
        background-color: #666;
      }

      /* ── Status message ── */
      #status {
        font-size: 0.75rem;
        color: #aaa;
        text-align: center;
        padding-bottom: 4px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header id="header">
        <img
          id="header-logo"
          src="https://www.united.com/2500e4e62233fbfe8ac6.unitedLogoNew.svg"
          alt="United Airlines"
        />
        <span id="header-title">Agent on Demand</span>
      </header>

      <img
        id="hero-image"
        src="https://images.unsplash.com/photo-1436491865332-7a61a109cc05?w=800&q=80"
        alt="United Airlines"
      />

      <div id="content">
        <div>
          <p id="greeting">Hi, how can we help?</p>
          <p id="subtext">A United Airlines agent is ready to assist you.</p>
        </div>

        <div id="chat-wrapper">
          <div id="chat-history"></div>
          <div id="chat-input-bar">
            <input
              id="chat-input"
              type="text"
              placeholder="Type a message..."
              autocomplete="off"
              autocorrect="off"
            />
            <button id="chat-send">Send</button>
          </div>
        </div>

        <p id="status"></p>
      </div>
    </div>

    <script src="./index.js"></script>
  </body>
</html>
