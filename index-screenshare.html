<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>United Airlines Support</title>
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif;
        background-color: #f5f5f5;
        color: #000;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      #app {
        width: 100%;
        max-width: 480px;
        min-height: 100dvh;
        background-color: #fff;
        display: flex;
        flex-direction: column;
      }

      /* ── Top header bar ── */
      #header {
        background-color: #1a56a0;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
      }

      #header-logo {
        height: 28px;
        width: auto;
        object-fit: contain;
        flex-shrink: 1;
        min-width: 0;
      }

      #header-title {
        color: #fff;
        font-size: 0.9rem;
        font-weight: 400;
        letter-spacing: 0.01em;
        flex: 1;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      #header-end {
        flex-shrink: 0;
        cursor: pointer;
        pointer-events: all;
        position: relative;
        z-index: 10;
      }

      /* ── Call status banner ── */
      #call-status {
        display: none;
        background-color: #1a56a0;
        color: #fff;
        text-align: center;
        padding: 10px 16px;
        font-size: 0.85rem;
        letter-spacing: 0.02em;
      }

      #call-status.active {
        display: block;
      }

      /* ── Screen share video ── */
      #remote-share-video {
        width: 100%;
        display: none;
        background: #000;
      }

      /* ── Hero image ── */
      #hero-image {
        width: 100%;
        aspect-ratio: 16 / 7;
        object-fit: cover;
        display: block;
        border-radius: 0 0 16px 16px;
      }

      /* ── Content area ── */
      #content {
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: 20px 16px 16px;
        gap: 16px;
      }

      /* ── Join button ── */
      #join-btn {
        width: 100%;
        padding: 14px;
        background-color: #1a56a0;
        color: #fff;
        border: none;
        border-radius: 12px;
        font-size: 1rem;
        font-family: inherit;
        font-weight: 500;
        cursor: pointer;
        transition: background-color 150ms ease;
      }

      #join-btn:active {
        background-color: #154a8a;
      }

      #join-btn:disabled {
        background-color: #aaa;
        cursor: not-allowed;
      }

      /* ── Concierge message ── */
      #concierge-message {
        padding: 14px 16px;
        border: 1px solid #e6e8e8;
        border-radius: 12px;
        background-color: #fafafa;
      }

      #concierge-sender {
        font-size: 0.72rem;
        font-weight: 600;
        color: #1a56a0;
        margin-bottom: 6px;
      }

      #concierge-text {
        font-size: 0.85rem;
        color: #555;
        line-height: 1.5;
        font-style: italic;
      }

      /* ── Status message ── */
      #status {
        font-size: 0.75rem;
        color: #aaa;
        text-align: center;
        padding-bottom: 4px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header id="header">
        <img
          id="header-logo"
          src="https://www.united.com/2500e4e62233fbfe8ac6.unitedLogoNew.svg"
          alt="United Airlines"
        />
        <span id="header-title">Agent on Demand</span>
        <svg id="header-end" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white" width="22" height="22" aria-label="End call" style="display:none;">
          <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
        </svg>
      </header>

      <div id="call-status">Screen sharing session active</div>

      <video id="remote-share-video" autoplay playsinline></video>

      <img
        id="hero-image"
        src="https://images.unsplash.com/photo-1436491865332-7a61a109cc05?w=800&q=80"
        alt="United Airlines"
      />

      <div id="content">
        <button id="join-btn">Join Session</button>

        <div id="concierge-message">
          <p id="concierge-sender">Concierge</p>
          <p id="concierge-text">Your United Airlines agent is ready to assist you. Tap "Join Session" to connect and view the agent's screen.</p>
        </div>

        <p id="status"></p>
      </div>
    </div>

    <script crossorigin src="https://unpkg.com/webex@3.7.0/umd/webex.min.js"></script>
    <script src="./index-screenshare.js"></script>
  </body>
</html>
