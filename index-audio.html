<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>United Airlines Support</title>
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif;
        background-color: #f5f5f5;
        color: #000;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      #app {
        width: 100%;
        max-width: 480px;
        min-height: 100dvh;
        background-color: #fff;
        display: flex;
        flex-direction: column;
      }

      /* ── Top header bar ── */
      #header {
        background-color: #1a56a0;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
      }

      #header-logo {
        height: 28px;
        width: auto;
        object-fit: contain;
        flex-shrink: 1;
        min-width: 0;
      }

      #header-title {
        color: #fff;
        font-size: 0.9rem;
        font-weight: 400;
        letter-spacing: 0.01em;
        flex: 1;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      #header-mic,
      #header-end {
        flex-shrink: 0;
        cursor: pointer;
        pointer-events: all;
        position: relative;
        z-index: 10;
      }

      /* ── Call status banner ── */
      #call-status {
        display: none;
        background-color: #1a56a0;
        color: #fff;
        text-align: center;
        padding: 10px 16px;
        font-size: 0.85rem;
        letter-spacing: 0.02em;
      }

      #call-status.active {
        display: block;
      }

      /* ── Hero image ── */
      #hero-image {
        width: 100%;
        aspect-ratio: 16 / 7;
        object-fit: cover;
        display: block;
        border-radius: 0 0 16px 16px;
      }

      /* ── Content area ── */
      #content {
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: 20px 16px 16px;
        gap: 16px;
      }

      /* ── Concierge message ── */
      #concierge-message {
        padding: 14px 16px;
        border: 1px solid #e6e8e8;
        border-radius: 12px;
        background-color: #fafafa;
      }

      #concierge-sender {
        font-size: 0.72rem;
        font-weight: 600;
        color: #1a56a0;
        margin-bottom: 6px;
      }

      #concierge-text {
        font-size: 0.85rem;
        color: #555;
        line-height: 1.5;
        font-style: italic;
      }

      /* ── Status message ── */
      #status {
        font-size: 0.75rem;
        color: #aaa;
        text-align: center;
        padding-bottom: 4px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header id="header">
        <img
          id="header-logo"
          src="https://www.united.com/2500e4e62233fbfe8ac6.unitedLogoNew.svg"
          alt="United Airlines"
        />
        <span id="header-title">Agent on Demand</span>
        <svg id="header-mic" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white" width="22" height="22" aria-label="Toggle audio">
          <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15c-.08-.49-.49-.85-.98-.85-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.1-.6-.39-1.14-1-1.14z"/>
        </svg>
        <svg id="header-end" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white" width="22" height="22" aria-label="End call" style="display:none;">
          <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
        </svg>
      </header>

      <div id="call-status">Call connected</div>

      <audio id="remote-view-audio" autoplay playsinline></audio>

      <img
        id="hero-image"
        src="https://images.unsplash.com/photo-1436491865332-7a61a109cc05?w=800&q=80"
        alt="United Airlines"
      />

      <div id="content">
        <div id="concierge-message">
          <p id="concierge-sender">Concierge</p>
          <p id="concierge-text">An Agent will be with you soon; please check back on this browser for assistance. Agent On Demand only accepts payments from authorized credit cards verified during flight check-in.</p>
        </div>
        <p id="status"></p>
      </div>
    </div>

    <script crossorigin src="https://unpkg.com/webex@3.7.0/umd/webex.min.js"></script>
    <script src="./index-audio.js"></script>
  </body>
</html>
